[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-graph-learning"
version = "0.1.0"
description = "Uncertainty-Aware Least-Privilege Repair for Cloud IAM under Partial Observability"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Duke", email = "duke@example.com" }
]
dependencies = [
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "networkx>=3.0",
    "scipy>=1.11.0",
    "z3-solver>=4.12.0",
    "pydantic>=2.6.0",
    "typing-extensions>=4.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
dashboard = [
    "streamlit>=1.30.0",
    "pyvis>=0.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
]
ignore = [
    "E501",   # line length violations (handled by ruff format)
]

[tool.ruff.lint.isort]
known-first-party = ["iam"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "torch_geometric.*",
    "networkx.*",
    "scipy.*",
    "z3.*",
    "pyvis.*",
    "streamlit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyrefly]
errors = { missing-source-for-stubs = "ignore" }
