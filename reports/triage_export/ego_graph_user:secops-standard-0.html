                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"borderWidth": 1, "color": "#9F7AEA", "font": {"color": "#FFFFFF"}, "id": "policy:secops-policy-0", "label": "policy:secops-policy-0", "shape": "box", "size": 18, "title": "\u003cb\u003eNode:\u003c/b\u003e policy:secops-policy-0\u003cbr\u003e\u003cb\u003eType:\u003c/b\u003e Policy\u003cbr\u003e\u003cb\u003eDepartment:\u003c/b\u003e SecOps\u003cbr\u003e\u003cb\u003eAdmin:\u003c/b\u003e YES\u003cbr\u003e\u003cb\u003eARN:\u003c/b\u003e arn:aws:iam::123456789012:policy/secops-policy-0"}, {"borderWidth": 1, "color": "#ED8936", "font": {"color": "#FFFFFF"}, "id": "Role_ExecutionEngine", "label": "Role_ExecutionEngine", "shape": "ellipse", "size": 18, "title": "\u003cb\u003eNode:\u003c/b\u003e Role_ExecutionEngine\u003cbr\u003e\u003cb\u003eType:\u003c/b\u003e Resource\u003cbr\u003e\u003cb\u003eDepartment:\u003c/b\u003e Engineering\u003cbr\u003e\u003cb\u003eAdmin:\u003c/b\u003e NO\u003cbr\u003e\u003cb\u003eARN:\u003c/b\u003e Role_ExecutionEngine"}, {"borderWidth": 3, "color": "#E53E3E", "font": {"color": "#FFFFFF"}, "id": "Resource_AdminLambda", "label": "Resource_AdminLambda", "shape": "diamond", "size": 28, "title": "\u003cb\u003eNode:\u003c/b\u003e Resource_AdminLambda\u003cbr\u003e\u003cb\u003eType:\u003c/b\u003e Resource\u003cbr\u003e\u003cb\u003eDepartment:\u003c/b\u003e Engineering\u003cbr\u003e\u003cb\u003eAdmin:\u003c/b\u003e NO\u003cbr\u003e\u003cb\u003eARN:\u003c/b\u003e Resource_AdminLambda"}, {"borderWidth": 1, "color": "#9F7AEA", "font": {"color": "#FFFFFF"}, "id": "policy:secops-policy-1", "label": "policy:secops-policy-1", "shape": "box", "size": 18, "title": "\u003cb\u003eNode:\u003c/b\u003e policy:secops-policy-1\u003cbr\u003e\u003cb\u003eType:\u003c/b\u003e Policy\u003cbr\u003e\u003cb\u003eDepartment:\u003c/b\u003e SecOps\u003cbr\u003e\u003cb\u003eAdmin:\u003c/b\u003e NO\u003cbr\u003e\u003cb\u003eARN:\u003c/b\u003e arn:aws:iam::123456789012:policy/secops-policy-1"}, {"borderWidth": 3, "color": "#F6AD55", "font": {"color": "#FFFFFF"}, "id": "user:secops-standard-0", "label": "user:secops-standard-0", "shape": "dot", "size": 26, "title": "\u003cb\u003eNode:\u003c/b\u003e user:secops-standard-0\u003cbr\u003e\u003cb\u003eType:\u003c/b\u003e User\u003cbr\u003e\u003cb\u003eDepartment:\u003c/b\u003e SecOps\u003cbr\u003e\u003cb\u003eAdmin:\u003c/b\u003e NO\u003cbr\u003e\u003cb\u003eARN:\u003c/b\u003e arn:aws:iam::123456789012:user/secops-standard-0"}, {"borderWidth": 1, "color": "#ED8936", "font": {"color": "#FFFFFF"}, "id": "group:secops-team-0", "label": "group:secops-team-0", "shape": "ellipse", "size": 18, "title": "\u003cb\u003eNode:\u003c/b\u003e group:secops-team-0\u003cbr\u003e\u003cb\u003eType:\u003c/b\u003e Group\u003cbr\u003e\u003cb\u003eDepartment:\u003c/b\u003e SecOps\u003cbr\u003e\u003cb\u003eAdmin:\u003c/b\u003e NO\u003cbr\u003e\u003cb\u003eARN:\u003c/b\u003e arn:aws:iam::123456789012:group/secops-team-0"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#718096", "dashes": false, "from": "user:secops-standard-0", "label": "MemberOf", "title": "\u003cb\u003eRelation:\u003c/b\u003e MemberOf\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e user:secops-standard-0\u003cbr\u003e\u003cb\u003eTarget:\u003c/b\u003e group:secops-team-0", "to": "group:secops-team-0", "width": 2}, {"arrows": "to", "color": "#718096", "dashes": false, "from": "group:secops-team-0", "label": "AttachedWith", "title": "\u003cb\u003eRelation:\u003c/b\u003e AttachedWith\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e group:secops-team-0\u003cbr\u003e\u003cb\u003eTarget:\u003c/b\u003e policy:secops-policy-0", "to": "policy:secops-policy-0", "width": 2}, {"arrows": "to", "color": "#718096", "dashes": false, "from": "group:secops-team-0", "label": "AttachedWith", "title": "\u003cb\u003eRelation:\u003c/b\u003e AttachedWith\u003cbr\u003e\u003cb\u003eSource:\u003c/b\u003e group:secops-team-0\u003cbr\u003e\u003cb\u003eTarget:\u003c/b\u003e policy:secops-policy-1", "to": "policy:secops-policy-1", "width": 2}, {"arrows": "to", "color": "#E53E3E", "dashes": [4, 4], "from": "user:secops-standard-0", "label": "[GNN: p\u0302=0.88]", "title": "\u003cb\u003eLATENT GNN BRIDGE\u003c/b\u003e\u003cbr\u003e\u003cb\u003eRelation:\u003c/b\u003e PassesTo\u003cbr\u003e\u003cb\u003eInferred Likelihood (P\u0302):\u003c/b\u003e 0.8800\u003cbr\u003e\u003cb\u003eStatus:\u003c/b\u003e ACTIVE (Exploitable)", "to": "Role_ExecutionEngine", "width": 3}, {"arrows": "to", "color": "#E53E3E", "dashes": [4, 4], "from": "Role_ExecutionEngine", "label": "[GNN: p\u0302=0.92]", "title": "\u003cb\u003eLATENT GNN BRIDGE\u003c/b\u003e\u003cbr\u003e\u003cb\u003eRelation:\u003c/b\u003e ActsOn\u003cbr\u003e\u003cb\u003eInferred Likelihood (P\u0302):\u003c/b\u003e 0.9200\u003cbr\u003e\u003cb\u003eStatus:\u003c/b\u003e ACTIVE (Exploitable)", "to": "Resource_AdminLambda", "width": 3}]);

                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"enabled": true, "solver": "forceAtlas2Based", "forceAtlas2Based": {"gravitationalConstant": -60, "centralGravity": 0.015, "springLength": 110, "springConstant": 0.08, "damping": 0.4, "avoidOverlap": 0.5}, "maxVelocity": 50, "minVelocity": 0.1, "timestep": 0.35, "stabilization": {"enabled": true, "iterations": 100, "updateInterval": 25, "onlyDynamicEdges": false, "fit": true}}, "interaction": {"hover": true, "hoverConnectedEdges": true, "tooltipDelay": 150, "navigationButtons": true, "keyboard": false, "zoomView": true}};






                  network = new vis.Network(container, data, options);










                  return network;

              }
